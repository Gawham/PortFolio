<script>
const STORAGE_KEY = 'iim-cv-editor-data-v2-guhan-vc';
const el = id => document.getElementById(id);
const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inlineHTML(text){
  let s = escapeHTML(text);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}
function plain(text){return String(text ?? '').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1').replace(/\*\*/g,'');}
function cleanFileName(name){return String(name || 'resume').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'resume';}
const DEFAULT_DATA = JSON.parse(el('defaultData').textContent);
let currentData = structuredClone(DEFAULT_DATA);
let currentMode = 'visual';
function footerHTML(d){return `<div class="footer">${escapeHTML(d.profile.address)} | Phone: ${escapeHTML(d.profile.phone)} |<br>Email: <a>${escapeHTML(d.profile.email)}</a></div>`;}
function headerHTML(d){return `<div class="page-header"><div class="name">${escapeHTML(d.profile.name)}</div><div class="subtitle">${escapeHTML(d.profile.subtitle)}</div></div>`;}
function section(title){return `<div class="section-title">${escapeHTML(title)}</div>`;}
function renderEducation(d){return `${section(d.sectionTitles.education)}<table class="edu-table"><thead><tr><th>College/School</th><th>Degree/ Class</th><th>GPA (%)</th><th>Year</th><th>Hallmarks</th></tr></thead><tbody>${d.education.map(r=>`<tr><td>${inlineHTML(r.institution)}</td><td>${inlineHTML(r.degree)}</td><td>${inlineHTML(r.gpa)}</td><td>${inlineHTML(r.year)}</td><td>${inlineHTML(r.hallmarks)}</td></tr>`).join('')}</tbody></table>`;}
function renderEntries(entries){return entries.map(e=>`<div class="entry"><div class="entry-head"><span class="entry-org">${inlineHTML(e.organization || e.name)}</span><span class="entry-date">${inlineHTML(e.dates)}</span></div>${e.title?`<div class="entry-role">${inlineHTML(e.title)}</div>`:''}<ul class="bullets">${(e.bullets||[]).map(b=>`<li>${inlineHTML(b)}</li>`).join('')}</ul></div>`).join('');}
function renderSimpleList(items, cls='simple-list'){return `<ul class="${cls}">${(items||[]).map(x=>`<li>${inlineHTML(x)}</li>`).join('')}</ul>`;}
function renderAchievements(d){return `${section(d.sectionTitles.achievements)}<div class="simple-list">${(d.achievements||[]).map(a=>`<div class="ach-row"><div>▪ ${inlineHTML(a.text)}</div><div class="year">${inlineHTML(a.year)}</div></div>`).join('')}</div>`;}
function splitFellowships(fellows){let idx=(fellows||[]).findIndex(f=>f.pageBreakBefore); return idx<0?[fellows||[],[]]:[fellows.slice(0,idx),fellows.slice(idx)];}
function renderVisual(d){
  const [f1,f2]=splitFellowships(d.fellowships);
  el('visualMount').innerHTML = `
    <section class="page">${headerHTML(d)}${renderEducation(d)}${section(d.sectionTitles.work)}${renderEntries(d.workExperience)}${section(d.sectionTitles.fellowships)}${renderEntries(f1)}${footerHTML(d)}</section>
    <section class="page">${headerHTML(d)}${renderEntries(f2)}${section(d.sectionTitles.publications)}${renderSimpleList(d.publications)}${renderAchievements(d)}${section(d.sectionTitles.conferences)}${renderSimpleList(d.conferences)}${section(d.sectionTitles.other)}${renderSimpleList(d.otherDetails)}${footerHTML(d)}</section>`;
}
function buildATSText(d){
  const lines=[]; const add=(x='')=>lines.push(x);
  add(d.profile.name); add(`${d.profile.subtitle} | ${d.profile.address} | Phone: ${d.profile.phone} | Email: ${d.profile.email}`); add('');
  add(d.sectionTitles.education); (d.education||[]).forEach(r=>{add(`${plain(r.institution)} — ${plain(r.degree)}`); add(`GPA: ${plain(r.gpa)} | Year: ${plain(r.year)} | Hallmarks: ${plain(r.hallmarks)}`);}); add('');
  add(d.sectionTitles.work); (d.workExperience||[]).forEach(e=>{add(`${plain(e.organization)} | ${plain(e.dates)}`); add(plain(e.title)); (e.bullets||[]).forEach(b=>add(`- ${plain(b)}`)); add('');});
  add(d.sectionTitles.fellowships); (d.fellowships||[]).forEach(e=>{add(`${plain(e.name)} | ${plain(e.dates)}`); (e.bullets||[]).forEach(b=>add(`- ${plain(b)}`));}); add('');
  add(d.sectionTitles.publications); (d.publications||[]).forEach(b=>add(`- ${plain(b)}`)); add('');
  add(d.sectionTitles.achievements); (d.achievements||[]).forEach(a=>add(`- ${plain(a.text)} ${plain(a.year)}`)); add('');
  add(d.sectionTitles.conferences); (d.conferences||[]).forEach(b=>add(`- ${plain(b)}`)); add('');
  add(d.sectionTitles.other); (d.otherDetails||[]).forEach(b=>add(`- ${plain(b)}`));
  return lines.join('\n');
}
function normalizePDFText(text){
  return String(text ?? '')
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[\u2013\u2014]/g,'-').replace(/\u2022/g,'-')
    .replace(/\u00a0/g,' ').normalize('NFKD').replace(/[^\x09\x0A\x0D\x20-\x7E]/g,'');
}
function wrapLine(line, max=92){
  line = normalizePDFText(line);
  if(!line.trim()) return [''];
  const out=[]; let rest=line;
  while(rest.length>max){
    let cut=rest.lastIndexOf(' ', max);
    if(cut<35) cut=max;
    out.push(rest.slice(0,cut));
    rest=rest.slice(cut).trimStart();
  }
  out.push(rest);
  return out;
}
function pdfEscape(s){return normalizePDFText(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
function buildATSPDF(d){
  const rawLines = buildATSText(d).split('\n');
  const lines=[]; rawLines.forEach(line=>wrapLine(line).forEach(x=>lines.push(x)));
  const pageW=612, pageH=792, margin=54, fontSize=10.5, lineH=14.25, startY=pageH-margin;
  const maxLines=Math.floor((pageH-margin*2)/lineH);
  const chunks=[]; for(let i=0;i<lines.length;i+=maxLines) chunks.push(lines.slice(i,i+maxLines));
  const objects=[null];
  objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objects[2]='';
  objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  const pageIds=[];
  for(const chunk of chunks){
    let stream=`BT\n/F1 ${fontSize} Tf\n${lineH} TL\n${margin} ${startY} Td\n`;
    for(const line of chunk){ stream += line ? `(${pdfEscape(line)}) Tj\nT*\n` : `T*\n`; }
    stream+='ET\n';
    const contentId=objects.length;
    objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);
    const pageId=objects.length;
    objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`);
    pageIds.push(pageId);
  }
  objects[2]=`<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
  let pdf='%PDF-1.4\n'; const offsets=[0];
  for(let i=1;i<objects.length;i++){ offsets[i]=pdf.length; pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`; }
  const xref=pdf.length;
  pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objects.length;i++) pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
  pdf+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return pdf;
}
function renderATS(d){el('atsMount').innerHTML = `<h2>What ATS sees</h2><pre>${escapeHTML(buildATSText(d))}</pre>`;}
function exportFormattedPDF(){
  setMode('visual');
  const base = location.href.slice(0, location.href.lastIndexOf('/') + 1);
  const styles = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n');
  const html = `<!doctype html><html><head><meta charset="utf-8"><base href="${base}"><title>${escapeHTML(currentData.profile.name)} formatted ATS PDF</title><style>${styles}\nhtml,body{margin:0!important;background:#fff!important;width:595.32pt!important}.print-root{margin:0;padding:0}.page{width:595.32pt!important;height:841.92pt!important;min-height:841.92pt!important;margin:0!important;box-shadow:none!important;overflow:hidden!important;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}.page:last-child{page-break-after:auto;break-after:auto}.section-title,.edu-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body><div class="print-root">${el('visualMount').innerHTML}</div><script>window.onload=async()=>{try{if(document.fonts) await document.fonts.ready;}catch(e){} setTimeout(()=>window.print(),250)};<\/script></body></html>`;
  const win = window.open('', '_blank');
  if(!win){
    el('status').textContent='Popup blocked. Allow popups for this file, then try again.';
    el('status').className='status err';
    return;
  }
  win.document.open(); win.document.write(html); win.document.close();
  el('status').textContent='Opened formatted resume export. In the print dialog choose “Save as PDF”.';
  el('status').className='status ok';
}
function renderAll(d){renderVisual(d);renderATS(d);}
function setMode(mode){currentMode=mode; el('visualMount').classList.toggle('hidden',mode!=='visual'); el('atsMount').classList.toggle('hidden',mode!=='ats'); el('visualBtn').classList.toggle('active',mode==='visual'); el('atsBtn').classList.toggle('active',mode==='ats');}
function applyFromInput(){
  try{ const d=JSON.parse(el('jsonInput').value); currentData=d; localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); renderAll(d); el('status').textContent='Saved and rendered.'; el('status').className='status ok'; }
  catch(err){ el('status').textContent='JSON error: '+err.message; el('status').className='status err'; }
}
function download(name, mime, content){const blob=new Blob([content],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function init(){
  const viewerMode = new URLSearchParams(location.search).has('viewer');
  if(viewerMode) document.body.classList.add('viewer');
  let saved=viewerMode ? null : localStorage.getItem(STORAGE_KEY); currentData=saved?JSON.parse(saved):structuredClone(DEFAULT_DATA); el('jsonInput').value=JSON.stringify(currentData,null,2); renderAll(currentData); setMode('visual');
  let timer; el('jsonInput').addEventListener('input',()=>{clearTimeout(timer); timer=setTimeout(applyFromInput,350);});
  el('applyBtn').onclick=applyFromInput; el('prettyBtn').onclick=()=>{applyFromInput(); el('jsonInput').value=JSON.stringify(currentData,null,2);};
  el('resetBtn').onclick=()=>{if(confirm('Reset to original IIM CV content?')){currentData=structuredClone(DEFAULT_DATA); localStorage.removeItem(STORAGE_KEY); el('jsonInput').value=JSON.stringify(currentData,null,2); renderAll(currentData);}};
  el('visualBtn').onclick=()=>setMode('visual'); el('atsBtn').onclick=()=>setMode('ats');
  el('exportPdfBtn').onclick=exportFormattedPDF;
}
window.exportFormattedPDF = exportFormattedPDF;
init();
</script>
